<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs - IskuXidh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#007AFF',
                            green: '#10B981',
                            yellow: '#FBBF24',
                            dark: '#1F2937',
                            light: '#F3F4F6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 text-brand-dark">

    <!-- Nav -->
    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
                        <div
                            class="w-8 h-8 bg-brand-blue rounded-lg flex items-center justify-center text-white font-bold text-xl">
                            <i data-lucide="link"></i>
                        </div>
                        <span class="font-heading font-bold text-2xl text-brand-blue">IskuXidh</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="chat.html" class="text-sm font-medium text-gray-500 hover:text-brand-blue">Messages</a>
                    <a href="employer.html" class="text-sm font-medium text-gray-500 hover:text-brand-blue">Employer
                        View</a>
                    <div
                        class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden border-2 border-white shadow-sm">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ahmed" alt="User">
                    </div>
                </div>
            </div>


        </div>
    </nav>

    <!-- Main Layout -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

            <!-- Filters Sidebar -->
            <div class="hidden lg:block space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-lg mb-4" data-i18n="jobs.filters">Filters</h3>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2"
                            data-i18n="jobs.location">Location</label>
                        <select id="filter-location"
                            class="w-full rounded-lg border-gray-200 border p-2 text-sm focus:ring-brand-blue focus:border-brand-blue">
                            <option value="">All Somalia</option>
                            <option value="Mogadishu">Mogadishu</option>
                            <option value="Hargeisa">Hargeisa</option>
                            <option value="Bosaso">Bosaso</option>
                        </select>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Job Type</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2 text-sm text-gray-600">
                                <input type="checkbox" class="rounded text-brand-blue"> Full-time
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-600">
                                <input type="checkbox" class="rounded text-brand-blue"> Gig / Daily
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-600">
                                <input type="checkbox" class="rounded text-brand-blue"> Remote
                            </label>
                        </div>
                    </div>

                    <button id="btn-apply-filters"
                        class="w-full py-2 bg-brand-blue text-white rounded-lg font-medium hover:bg-blue-600 transition"
                        data-i18n="jobs.apply">
                        Apply Filters
                    </button>
                </div>
            </div>

            <!-- Job Feed -->
            <div class="lg:col-span-3 space-y-4">

                <!-- Search Bar -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4">
                    <div class="flex-1 relative">
                        <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                        <input id="search-input" type="text" placeholder="Search jobs (e.g., Driver, Developer)..."
                            data-i18n-placeholder="jobs.search.placeholder"
                            class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-blue/20">
                    </div>
                </div>

                <!-- Dynamic Jobs Container -->
                <div id="jobs" class="space-y-4">
                    <!-- Jobs will be loaded here -->
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="jobs.js"></script>

    <script src="lang.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
