<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Payment - IskuXidh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { blue: '#007AFF', dark: '#1F2937', green: '#10B981' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-['Inter']">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-brand-blue p-8 text-center text-white">
            <div
                class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-md">
                <i data-lucide="wallet" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2" data-i18n="pay.title">Registration Fee</h1>
            <p class="text-blue-100 text-sm" data-i18n="pay.subtitle">One-time payment to active your account</p>
        </div>

        <!-- Body -->
        <div class="p-8 space-y-6">
            <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border border-gray-100">
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold tracking-wider" data-i18n="pay.amount_label">
                        Amount to Pay</p>
                    <p class="text-2xl font-black text-brand-dark">$5.00 <span
                            class="text-sm font-normal text-gray-400">USD</span></p>
                </div>
                <div class="bg-brand-green/10 text-brand-green px-3 py-1 rounded-full text-xs font-bold"
                    data-i18n="pay.lifetime">Lifetime</div>
            </div>

            <!-- Payment Methods -->
            <div class="space-y-4">
                <p class="text-sm font-bold text-gray-700" data-i18n="pay.methods_title">Mobile Money Transfer</p>
                <div class="grid grid-cols-1 gap-3">
                    <div class="p-4 border-2 border-brand-blue bg-blue-50 rounded-2xl">
                        <div class="flex items-center gap-4 mb-3">
                            <div
                                class="w-10 h-10 bg-white rounded-xl shadow-sm flex items-center justify-center font-bold text-brand-blue">
                                *711#</div>
                            <div>
                                <p class="text-sm font-bold">EVC Plus / Sahal / Zaad</p>
                                <p class="text-xs text-gray-400" data-i18n="pay.receiver_label">Payment Receiver
                                    (Loodiraha)</p>
                            </div>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-blue-100 flex items-center justify-between">
                            <span class="font-mono text-lg font-bold text-brand-blue">+252 61 2814881</span>
                            <button onclick="copyNumber('+252 61 2814881')"
                                class="text-xs bg-brand-blue/10 text-brand-blue px-2 py-1 rounded-md font-bold hover:bg-brand-blue/20 transition">Copy</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Transaction Input -->
            <form id="payment-form" onsubmit="handlePayment(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="pay.phone_label">Phone Number
                        Used to Pay</label>
                    <input type="tel" id="sender-phone" required placeholder="E.g. 061XXXXXXX"
                        class="w-full rounded-xl border-gray-200 border p-4 text-sm focus:ring-brand-blue focus:border-brand-blue shadow-sm mb-4">

                    <label class="block text-sm font-medium text-gray-700 mb-1"
                        data-i18n="pay.trans_id_label">Transaction ID</label>
                    <input type="text" id="trans-id" required placeholder="E.g. TXN123456789"
                        class="w-full rounded-xl border-gray-200 border p-4 text-sm focus:ring-brand-blue focus:border-brand-blue shadow-sm">
                    <p class="text-[10px] text-gray-400 mt-2" data-i18n="pay.trans_help">Enter the Transaction ID and
                        phone number used for the payment.</p>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-4 bg-brand-blue text-white rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-600 transition flex items-center justify-center gap-2">
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                    <span data-i18n="pay.submit_btn">Verify Payment</span>
                </button>
            </form>

            <button onclick="logoutAndBack()"
                class="w-full text-center text-sm text-gray-400 hover:text-gray-600 transition"
                data-i18n="pay.later">Pay Later & Logout</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="lang.js"></script>
    <script>
        // Update Lang Strings for Payment
        translations.en["pay.title"] = "Registration Fee";
        translations.so["pay.title"] = "Lacagta Diiwaan-gelinta";
        translations.en["pay.subtitle"] = "One-time payment to activate your account";
        translations.so["pay.subtitle"] = "Lacag hal mar ah si aad u furto akoonkaaga";
        translations.en["pay.amount_label"] = "Amount to Pay";
        translations.so["pay.amount_label"] = "Lacagta la bixinayo";
        translations.en["pay.lifetime"] = "Lifetime Access";
        translations.so["pay.lifetime"] = "Waligaa";
        translations.en["pay.methods_title"] = "Mobile Money Transfer";
        translations.so["pay.methods_title"] = "Ku bixi Mobilkaaga";
        translations.en["pay.receiver_label"] = "Payment Receiver (To)";
        translations.so["pay.receiver_label"] = "Lambarka Lacagta loo dirayo (Loodiraha)";
        translations.en["pay.phone_label"] = "Your Phone Number (Sender)";
        translations.so["pay.phone_label"] = "Lambarkaaga (Kan aad lacagta ka dirtay)";
        translations.en["pay.trans_id_label"] = "Transaction ID";
        translations.so["pay.trans_id_label"] = "Lambarka Faahfaahinta (Trans ID)";
        translations.en["pay.trans_help"] = "Enter the Transaction ID and phone number from your confirmation SMS.";
        translations.so["pay.trans_help"] = "Geli Transaction ID-ga iyo lambarka aad lacagta ka dirtay.";
        translations.en["pay.submit_btn"] = "Verify Payment";
        translations.so["pay.submit_btn"] = "Hubi Lacag-bixinta";
        translations.en["pay.later"] = "Pay Later & Logout";
        translations.so["pay.later"] = "Hadhow bixi & Bax (Logout)";

        lucide.createIcons();
        updatePage();

        function copyNumber(num) {
            navigator.clipboard.writeText(num);
            alert(currentLang === 'so' ? "Lambarka waa la guuriyey!" : "Number copied to clipboard!");
        }

        async function handlePayment(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const transId = document.getElementById('trans-id').value;
            const senderPhone = document.getElementById('sender-phone').value;

            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin mr-2">⏳</span> Processing...';

            const { data: { user } } = await db.auth.getUser();

            if (!user) {
                alert("Please login first.");
                window.location.href = 'auth.html';
                return;
            }

            const { error } = await db.from('profiles').update({
                last_transaction_id: transId,
                payment_phone: senderPhone,
                payment_status: 'paid' // In a real app, this would be 'pending_verification'
            }).eq('id', user.id);

            if (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerText = "Verify Payment";
            } else {
                alert(currentLang === 'so' ? "Mahadsanid! Akoonkaga waa la furay." : "Success! Your account is now active.");
                window.location.href = 'index.html';
            }
        }

        async function logoutAndBack() {
            await db.auth.signOut();
            window.location.href = 'auth.html';
        }
    </script>
</body>

</html>
