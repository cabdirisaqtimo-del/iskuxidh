<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - IskuXidh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#007AFF',
                            green: '#10B981',
                            yellow: '#FBBF24',
                            dark: '#1F2937',
                            light: '#F3F4F6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 text-brand-dark">

    <!-- Nav -->
    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-2">
                    <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
                        <div
                            class="w-8 h-8 bg-brand-blue rounded-lg flex items-center justify-center text-white font-bold text-xl">
                            <i data-lucide="link"></i>
                        </div>
                        <span class="font-heading font-bold text-2xl text-brand-blue">IskuXidh</span>
                    </a>
                </div>

                <div class="flex items-center space-x-4">
                    <a href="jobs.html" class="text-gray-600 hover:text-brand-blue">Find Jobs</a>
                    <div
                        class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden border-2 border-brand-blue shadow-sm">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ahmed" alt="User">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="max-w-4xl mx-auto px-4 py-8">

        <!-- Profile Header -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
            <div class="h-32 bg-gradient-to-r from-brand-blue to-purple-500"></div>
            <div class="px-8 pb-8 relative">
                <div class="-mt-12 mb-4 flex justify-between items-end">
                    <div class="w-24 h-24 rounded-full bg-white p-1 shadow-lg">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ahmed" alt="User"
                            class="w-full h-full rounded-full bg-gray-100">
                    </div>

                    <div class="flex gap-2">
                        <button onclick="openEditModal()"
                            class="px-4 py-2 bg-brand-blue text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition flex items-center gap-2 shadow-sm">
                            <i data-lucide="edit-3" class="w-4 h-4"></i> Edit Profile
                        </button>
                        <button onclick="handleSignOut()"
                            class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-sm font-medium transition flex items-center gap-2">
                            <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                        </button>
                    </div>
                </div>

                <div>
                    <h1 class="text-2xl font-bold font-heading flex items-center gap-2">
                        <span id="profile-name">Loading...</span>
                        <i id="verified-badge" data-lucide="check-circle"
                            class="w-5 h-5 text-brand-blue fill-blue-100 hidden" title="Verified"></i>
                    </h1>
                    <p id="user-email" class="text-gray-500 mb-4">Loading email...</p>

                    <div id="skills-container" class="flex flex-wrap gap-2">
                        <!-- Skills will load here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Left Info -->
            <div class="space-y-6">
                <!-- Contact -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold mb-4">Contact Info</h3>
                    <ul class="space-y-3 text-sm text-gray-600">
                        <li class="flex items-center gap-3">
                            <i data-lucide="mail" class="w-4 h-4 text-gray-400"></i>
                            <span id="contact-email">loading...</span>
                        </li>
                        <li class="flex items-center gap-3">
                            <i data-lucide="phone" class="w-4 h-4 text-gray-400"></i>
                            <span id="contact-phone">loading...</span>
                        </li>
                        <li class="flex items-center gap-3">
                            <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i>
                            <span id="contact-location">loading...</span>
                        </li>
                    </ul>
                </div>

                <!-- CV -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold mb-4">CV / Resume</h3>
                    <div
                        class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100 mb-3">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <i data-lucide="file-text" class="text-red-500 w-5 h-5 flex-shrink-0"></i>
                            <span id="cv-filename" class="text-sm truncate">No CV Uploaded</span>
                        </div>
                    </div>
                    <button onclick="alert('File upload coming soon! For now, update your bio.')"
                        class="w-full py-2 border border-dashed border-gray-300 text-gray-500 rounded-lg text-sm hover:border-brand-blue hover:text-brand-blue transition">
                        + Upload New CV
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="md:col-span-2 space-y-6">

                <!-- About -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold mb-3">About Me</h3>
                    <p id="profile-bio" class="text-gray-600 text-sm leading-relaxed whitespace-pre-line">
                        Loading bio...
                    </p>
                </div>

                <!-- Experience -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold mb-4">Experience</h3>
                    <p class="text-gray-400 text-sm italic">Add your professional background here.</p>
                </div>

            </div>
        </div>

    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal"
        class="hidden fixed inset-0 bg-brand-dark/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold font-heading">Edit Profile</h2>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <form id="edit-profile-form" onsubmit="handleUpdateProfile(event)" class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input id="edit-name" type="text" required
                            class="w-full rounded-lg border-gray-200 border p-2.5 text-sm focus:ring-brand-blue focus:border-brand-blue">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                        <input id="edit-phone" type="text" placeholder="+252..."
                            class="w-full rounded-lg border-gray-200 border p-2.5 text-sm focus:ring-brand-blue focus:border-brand-blue">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
                        <input id="edit-city" type="text"
                            class="w-full rounded-lg border-gray-200 border p-2.5 text-sm focus:ring-brand-blue focus:border-brand-blue">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
                    <textarea id="edit-bio" rows="4"
                        class="w-full rounded-lg border-gray-200 border p-2.5 text-sm focus:ring-brand-blue focus:border-brand-blue"
                        placeholder="Tell employers about your experience and what you're looking for..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Skills (Comma separated)</label>
                    <input id="edit-skills" type="text" placeholder="React, Accounting, Driving, etc."
                        class="w-full rounded-lg border-gray-200 border p-2.5 text-sm focus:ring-brand-blue focus:border-brand-blue">
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeEditModal()"
                        class="flex-1 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
                        Cancel
                    </button>
                    <button type="submit"
                        class="flex-1 py-2.5 bg-brand-blue text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition shadow-md shadow-blue-200">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="profile.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
